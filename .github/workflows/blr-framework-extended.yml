name: BLR framework extended validation

on:
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    env:
      SBLR_RUN_EXTENDED_REPRODUCIBILITY: "true"
      SBLR_RUN_PEAK_RSS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgload, any::processx, any::ps
          needs: check
          cache-version: 1
      - name: Compile and run full suite
        run: Rscript -e "Rcpp::compileAttributes('.'); pkgload::load_all('.', compile=TRUE); devtools::test('.')"
      - name: Unified architecture and mutation audits
        run: |
          Rscript tools/audit/blr_phase18_unified_architecture_audit.R
          Rscript tools/audit/blr_phase18_mutation_sensitivity.R
            Rscript tools/audit/blr_phase19_mt_bayesr_architecture_audit.R
            Rscript tools/audit/blr_phase19_mutation_sensitivity.R
            Rscript tools/audit/blr_phase20_mt_bayesrc_architecture_audit.R
            Rscript tools/audit/blr_phase20_mutation_sensitivity.R
      - name: Peak-RSS smoke measurement
        run: Rscript tools/benchmarks/measure_peak_rss.R --smoke
      - name: Package check
        run: R CMD check --no-manual --no-build-vignettes .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-check
          path: "*.Rcheck/**"
