name: BLR framework extended validation

on:
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    env:
      SBLR_RUN_FRESH_PROCESS_TESTS: "true"
      SBLR_RUN_PHASE11A_FRESH: "true"
      SBLR_RUN_PHASE11B_FRESH: "true"
      SBLR_RUN_PHASE17B_FRESH: "true"
      SBLR_RUN_PHASE17C_FRESH: "true"
      SBLR_RUN_PEAK_RSS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgload, any::processx, any::ps
          needs: check
          cache-version: 1
      - name: Compile and run full suite
        run: Rscript -e "Rcpp::compileAttributes('.'); pkgload::load_all('.', compile=TRUE); devtools::test('.')"
      - name: Peak-RSS smoke measurement
        run: Rscript tools/benchmarks/measure_peak_rss.R --smoke
      - name: Package check
        run: R CMD check --no-manual --no-build-vignettes .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-check
          path: "*.Rcheck/**"
