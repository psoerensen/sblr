name: BLR framework fast gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgload
          needs: check
          cache-version: 1
      - name: Compile attributes and load native package
        run: Rscript -e "Rcpp::compileAttributes('.'); pkgload::load_all('.', compile=TRUE)"
      - name: Fast permanent scientific and software contracts
        run: Rscript -e "pkgload::load_all('.', compile=FALSE, quiet=TRUE); devtools::test('.', filter='blr-(unified-public-contract|model-semantics|operator-reductions|unified-convergence|selected-marker-diagnostics|extended-(covariance|probability|parameter)-diagnostics)|mtblr-(bayesr-model|bayesrc-model|raw-schema)|stblr-(selection-s|annotation-backends|raw-schema)|backend-consistency')"
      - name: Generated interface audit
        run: Rscript tools/audit/blr_generated_interfaces_audit.R
      - name: Package check
        # R CMD check is run against the built source tarball by this driver.
        run: Rscript tools/check/check_package.R .
