name: BLR framework fast gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgload
          needs: check
          cache-version: 1
      - name: Compile attributes and load native package
        run: Rscript -e "Rcpp::compileAttributes('.'); pkgload::load_all('.', compile=TRUE)"
      - name: Fast deterministic framework and schema tests
          run: Rscript -e "pkgload::load_all('.', compile=FALSE, quiet=TRUE); devtools::test('.', filter='blr-framework-phase(3|4|6|8|9c|9e|9g|10d|11d|12a|13e|14e|15b|16a|17a|17b|17c|17d|17e|17f|17h)|blr-test-contracts|raw-schema|backend-consistency|csr-interface|bed-interface')"
      - name: Package check
        run: R CMD check --no-manual --no-build-vignettes .
